<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GDevelop Resources by IvanMass99</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #09070f;
        --bg-alt: #130d1f;
        --card: #171125;
        --text: #f5f1ff;
        --muted: #b7a9cf;
        --primary: #8b5cf6;
        --primary-hover: #7c3aed;
        --border: #2f2048;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: linear-gradient(155deg, var(--bg), var(--bg-alt));
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .hero {
        position: relative;
        width: 100%;
        min-height: 260px;
        background-image:
          linear-gradient(to bottom, rgba(8, 5, 15, 0.82), rgba(8, 5, 15, 0.88)),
          url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEVYRhIrAyFgUkv1AvD6d1gwd6Jceehbvwahh-5Fb0yg&s=10");
        background-size: cover;
        background-position: center;
        display: grid;
        place-items: center;
      }

      .hero-content {
        width: min(1100px, 92%);
      }

      .hero-title {
        margin: 0 0 0.9rem;
        font-size: clamp(1.5rem, 4vw, 2.5rem);
      }

      main {
        width: min(1100px, 92%);
        margin: 2rem auto 3rem;
        flex: 1;
      }

      .filters {
        margin-bottom: 1.6rem;
        padding: 1rem 1rem 1.15rem;
        background: rgba(139, 92, 246, 0.08);
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .search-label {
        display: block;
        font-size: 0.88rem;
        color: var(--muted);
        margin-bottom: 0.45rem;
      }

      .search-input {
        width: 100%;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: rgba(7, 5, 13, 0.7);
        color: var(--text);
        padding: 0.62rem 0.75rem;
        font: inherit;
        margin-bottom: 0.9rem;
      }

      .search-input::placeholder {
        color: #9b8fb3;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }

      .tag-filters {
        display: flex;
        gap: 0.65rem;
        flex-wrap: wrap;
      }

      .filter-pill,
      .stat-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.42rem 0.7rem;
        color: var(--text);
        font-size: 0.9rem;
        background: rgba(9, 7, 16, 0.7);
      }

      .filter-pill {
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease;
      }

      .filter-pill.active {
        border-color: rgba(139, 92, 246, 0.8);
        background: rgba(139, 92, 246, 0.2);
      }

      .star-icon {
        color: #facc15;
      }

      .status {
        color: var(--muted);
        margin-top: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1rem;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .card h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }

      .icon-capsule {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        background: linear-gradient(to bottom, #ffffff, #999999);
        padding: 6px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
      }

      .icon-capsule img {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        object-fit: contain;
        background: rgba(0, 0, 0, 0.16);
      }

      .icon-capsule i {
        font-size: 1.7rem;
        color: #2b2b2b;
      }

      .meta {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .details {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.35rem;
      }

      .details li {
        color: var(--muted);
        font-size: 0.9rem;
        overflow-wrap: anywhere;
      }

      .details strong {
        color: var(--text);
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
      }

      .tag {
        border-radius: 999px;
        padding: 0.25rem 0.65rem;
        font-size: 0.8rem;
        border: 1px solid transparent;
      }

      .tag-a {
        background: rgba(139, 92, 246, 0.18);
        border-color: rgba(139, 92, 246, 0.42);
      }

      .tag-b {
        background: rgba(34, 197, 94, 0.16);
        border-color: rgba(34, 197, 94, 0.38);
      }

      .actions {
        display: flex;
        gap: 0.6rem;
        margin-top: auto;
      }

      button,
      a.btn {
        border: 0;
        border-radius: 8px;
        padding: 0.55rem 0.8rem;
        background: var(--primary);
        color: var(--text);
        text-decoration: none;
        cursor: pointer;
        font-size: 0.9rem;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        transition: background 0.2s ease;
      }

      button:hover,
      a.btn:hover {
        background: var(--primary-hover);
      }

      button.filter-pill {
        border: 1px solid var(--border);
        padding: 0.42rem 0.7rem;
        background: rgba(9, 7, 16, 0.7);
      }

      button.filter-pill:hover {
        background: rgba(139, 92, 246, 0.2);
      }

      footer {
        width: min(1100px, 92%);
        margin: 0 auto 1.4rem;
        color: var(--muted);
        font-size: 0.9rem;
        text-align: center;
      }

      .footer-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.8rem 1.2rem;
      }

      footer a {
        color: var(--text);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="hero-content">
        <h1 class="hero-title">GDevelop Resources</h1>
      </div>
    </header>
    <main>
      <section class="filters">
        <div class="topbar">
          <div class="tag-filters" id="tagFilters"></div>
          <span class="stat-pill">
            <i class="bi bi-star-fill star-icon" aria-hidden="true"></i>
            <span id="starsCount">--</span> favorites
          </span>
        </div>
        <label class="search-label" for="searchInput">Search by project name</label>
        <input
          class="search-input"
          type="search"
          id="searchInput"
          placeholder="Type to find projects..."
          autocomplete="off"
        />
      </section>
      <p class="status" id="status">Loading projects...</p>
      <section class="grid" id="projects"></section>
    </main>
    <footer>
      <div class="footer-links">
        <a href="https://buymeacoffee.com/ivan.dev1" target="_blank" rel="noopener noreferrer">
          <i class="bi bi-cup-hot-fill" aria-hidden="true"></i>
          <span>Donate</span>
        </a>
        <a href="https://gdevelop.io/download" target="_blank" rel="noopener noreferrer">
          <i class="bi bi-cloud-arrow-down-fill" aria-hidden="true"></i>
          <span>Download GDevelop</span>
        </a>
        <a href="https://editor.gdevelop.io/" target="_blank" rel="noopener noreferrer">
          <i class="bi bi-globe2" aria-hidden="true"></i>
          <span>Use GDevelop in Browser</span>
        </a>
      </div>
    </footer>

    <script>
      const owner = "IvanMass99";
      const repo = "GDevelop-Resources";
      const statusEl = document.getElementById("status");
      const projectsEl = document.getElementById("projects");
      const starsCountEl = document.getElementById("starsCount");
      const tagFiltersEl = document.getElementById("tagFilters");
      const searchInputEl = document.getElementById("searchInput");
      let allProjects = [];
      let activeTag = "all";
      let currentBranch = "";

      const api = (path) => `https://api.github.com/repos/${owner}/${repo}${path}`;
      const raw = (path, branch) => `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}`;
      const requiredProjectJsonKeyOrder = [
        "author",
        "category",
        "dimension",
        "extensionNamespace",
        "fullName",
        "gdevelopVersion",
        "helpPath",
        "iconUrl",
        "name",
        "previewIconUrl",
        "shortDescription",
        "version",
        "description",
      ];

      const getJson = async (url) => {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Error ${response.status}`);
        return response.json();
      };

      const hasExpectedProjectSchema = (json) => {
        if (!json || typeof json !== "object" || Array.isArray(json)) return false;
        const keys = Object.keys(json);

        return requiredProjectJsonKeyOrder.every((key, index) => keys[index] === key);
      };

      const normalizeDescription = (description) => {
        if (Array.isArray(description)) {
          return description.filter((line) => typeof line === "string" && line.trim()).join(" ").trim();
        }

        return typeof description === "string" ? description : "";
      };

      const normalizeTags = (tags) => {
        if (!Array.isArray(tags)) return [];
        return tags
          .filter((tag) => typeof tag === "string")
          .map((tag) => tag.trim())
          .filter(Boolean);
      };

      const findProjectJson = (treePaths, projectDir) => {
        const preferred = `Extensions/${projectDir}/${projectDir}.json`;
        if (treePaths.includes(preferred)) return preferred;

        return (
          treePaths.find(
            (path) =>
              path.startsWith(`Extensions/${projectDir}/`) &&
              path.split("/").length === 3 &&
              path.endsWith(".json")
          ) || null
        );
      };

      const findProjectIcon = (projectFiles, projectDir) => {
        const iconBasePath = `Extensions/${projectDir}/assets/desktop-icon-512`;

        return (
          projectFiles.find(
            (path) => path === iconBasePath || path.startsWith(`${iconBasePath}.`)
          ) || null
        );
      };

      const renderProjectCard = (project, branch) => {
        const card = document.createElement("article");
        card.className = "card";

        const cardHeader = document.createElement("div");
        cardHeader.className = "card-header";

        const iconCapsule = document.createElement("div");
        iconCapsule.className = "icon-capsule";

        if (project.iconUrl || project.iconPath) {
          const logo = document.createElement("img");
          logo.src = project.iconUrl || raw(project.iconPath, branch);
          logo.alt = `${project.name} icon`;
          iconCapsule.appendChild(logo);
        } else {
          iconCapsule.innerHTML = '<i class="bi bi-image" aria-hidden="true"></i>';
        }

        const title = document.createElement("h2");
        title.textContent = project.name;

        const meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = project.description || "No description available";

        const details = document.createElement("ul");
        details.className = "details";
        const detailRows = [
          ["Author", project.author || "Not provided"],
          ["Version", project.version || "Not provided"],
          ["Folder", project.folder],
          ["File", project.jsonPath || "Not found"],
          ["Files", String(project.fileCount)],
        ];

        detailRows.forEach(([label, value]) => {
          const li = document.createElement("li");
          const labelEl = document.createElement("strong");
          labelEl.textContent = `${label}:`;
          li.appendChild(labelEl);
          li.append(` ${value}`);
          details.appendChild(li);
        });

        let tagsEl = null;
        if (project.tags.length) {
          tagsEl = document.createElement("div");
          tagsEl.className = "tags";
          project.tags.forEach((tag, index) => {
            const bubble = document.createElement("span");
            bubble.className = `tag ${index % 2 === 0 ? "tag-a" : "tag-b"}`;
            bubble.textContent = tag;
            tagsEl.appendChild(bubble);
          });
        }

        const actions = document.createElement("div");
        actions.className = "actions";

        const download = document.createElement("a");
        download.className = "btn";
        download.target = "_blank";
        download.rel = "noopener noreferrer";
        download.innerHTML = '<i class="bi bi-download"></i><span>Download extension</span>';
        const treeUrl = `https://github.com/${owner}/${repo}/tree/${branch}/Extensions/${project.folder}`;
        download.href = `https://download-directory.github.io/?url=${encodeURIComponent(treeUrl)}`;

        actions.append(download);
        cardHeader.append(iconCapsule, title);
        card.append(cardHeader, meta, details);
        if (tagsEl) card.appendChild(tagsEl);
        card.append(actions);
        projectsEl.appendChild(card);
      };

      const buildTagFilters = (projects) => {
        const tagMap = new Map();
        projects.forEach((project) => {
          project.tags.forEach((tag) => {
            const key = tag.toLowerCase();
            if (!tagMap.has(key)) tagMap.set(key, tag);
          });
        });

        const sortedTags = Array.from(tagMap.entries()).sort((a, b) => a[1].localeCompare(b[1]));

        tagFiltersEl.innerHTML = "";
        const allButton = document.createElement("button");
        allButton.type = "button";
        allButton.className = "filter-pill";
        allButton.textContent = "All tags";
        allButton.dataset.tag = "all";
        if (activeTag === "all") allButton.classList.add("active");
        tagFiltersEl.appendChild(allButton);

        sortedTags.forEach(([key, label]) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "filter-pill";
          button.textContent = label;
          button.dataset.tag = key;
          if (activeTag === key) button.classList.add("active");
          tagFiltersEl.appendChild(button);
        });
      };

      const updateActiveTagButton = () => {
        tagFiltersEl.querySelectorAll(".filter-pill").forEach((button) => {
          button.classList.toggle("active", button.dataset.tag === activeTag);
        });
      };

      const renderProjects = (branch) => {
        const searchTerm = searchInputEl.value.trim().toLowerCase();
        const filteredProjects = allProjects.filter((project) => {
          const matchesTag =
            activeTag === "all" || project.tags.some((tag) => tag.toLowerCase() === activeTag);
          const matchesSearch = project.name.toLowerCase().includes(searchTerm);
          return matchesTag && matchesSearch;
        });

        projectsEl.innerHTML = "";
        filteredProjects.forEach((project) => renderProjectCard(project, branch));

        if (!allProjects.length) {
          statusEl.textContent = "No valid projects were found.";
          return;
        }

        if (!filteredProjects.length) {
          statusEl.textContent = "No projects match the selected filters.";
          return;
        }

        statusEl.textContent = `${filteredProjects.length} project(s) shown.`;
      };

      tagFiltersEl.addEventListener("click", (event) => {
        const button = event.target.closest(".filter-pill");
        if (!button) return;
        activeTag = button.dataset.tag || "all";
        updateActiveTagButton();
        renderProjects(currentBranch);
      });

      searchInputEl.addEventListener("input", () => {
        renderProjects(currentBranch);
      });

      const loadProjects = async () => {
        try {
          const repoInfo = await getJson(api(""));
          const branch = repoInfo.default_branch;
          currentBranch = branch;
          starsCountEl.textContent = String(repoInfo.stargazers_count ?? "--");

          const extensionsEntries = await getJson(api(`/contents/Extensions?ref=${branch}`));
          const projectDirs = extensionsEntries.filter((entry) => entry.type === "dir").map((entry) => entry.name);

          const fullTree = await getJson(api(`/git/trees/${branch}?recursive=1`));
          const filePaths = (fullTree.tree || [])
            .filter((entry) => entry.type === "blob")
            .map((entry) => entry.path);

          const projects = await Promise.all(
            projectDirs.map(async (folder) => {
              const projectFiles = filePaths.filter((path) => path.startsWith(`Extensions/${folder}/`));
              const jsonPath = findProjectJson(filePaths, folder);
              const iconPath = findProjectIcon(projectFiles, folder);
              if (!jsonPath) return null;

              try {
                const json = await getJson(raw(jsonPath, branch));
                if (!hasExpectedProjectSchema(json)) return null;

                const name = typeof json.name === "string" ? json.name : "";
                if (!name.trim()) return null;

                const author = typeof json.author === "string" ? json.author : "";
                const version = typeof json.version === "string" ? json.version : "";
                const iconUrl = typeof json.iconUrl === "string" ? json.iconUrl : "";
                const description = normalizeDescription(json.description);
                const tags = normalizeTags(json.tags);

                return {
                  folder,
                  name,
                  description,
                  author,
                  version,
                  jsonPath,
                  iconPath,
                  iconUrl,
                  tags,
                  fileCount: projectFiles.length,
                };
              } catch {
                return null;
              }
            })
          );
          const validProjects = projects.filter((project) => project !== null);

          projectsEl.innerHTML = "";

          allProjects = validProjects;
          buildTagFilters(allProjects);
          updateActiveTagButton();
          renderProjects(branch);
        } catch (error) {
          statusEl.textContent = "Could not load projects.";
          console.error(error);
        }
      };

      loadProjects();
    </script>
  </body>
</html>
