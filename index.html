<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recursos para GDevelop por IvanMass99</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #09070f;
        --bg-alt: #130d1f;
        --card: #171125;
        --text: #f5f1ff;
        --muted: #b7a9cf;
        --primary: #8b5cf6;
        --primary-hover: #7c3aed;
        --border: #2f2048;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: linear-gradient(155deg, var(--bg), var(--bg-alt));
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      main {
        width: min(1100px, 92%);
        margin: 3rem auto;
        flex: 1;
      }

      .banner {
        margin-bottom: 1.6rem;
        padding: 1rem;
        background: rgba(139, 92, 246, 0.08);
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .banner-title {
        margin: 0 0 0.8rem;
        font-size: clamp(1.15rem, 2.2vw, 1.7rem);
      }

      .banner-stats {
        display: flex;
        gap: 0.65rem;
        flex-wrap: wrap;
      }

      .stat-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.42rem 0.7rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .status {
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1rem;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .card h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }

      .icon-capsule {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        background: linear-gradient(to bottom, #ffffff, #999999);
        padding: 6px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
      }

      .icon-capsule img {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        object-fit: contain;
        background: rgba(0, 0, 0, 0.16);
      }

      .icon-capsule i {
        font-size: 1.7rem;
        color: #2b2b2b;
      }

      .meta {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .details {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.35rem;
      }

      .details li {
        color: var(--muted);
        font-size: 0.9rem;
        overflow-wrap: anywhere;
      }

      .details strong {
        color: var(--text);
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
      }

      .tag {
        border-radius: 999px;
        padding: 0.25rem 0.65rem;
        font-size: 0.8rem;
        border: 1px solid transparent;
      }

      .tag-a {
        background: rgba(139, 92, 246, 0.18);
        border-color: rgba(139, 92, 246, 0.42);
      }

      .tag-b {
        background: rgba(34, 197, 94, 0.16);
        border-color: rgba(34, 197, 94, 0.38);
      }

      .actions {
        display: flex;
        gap: 0.6rem;
        margin-top: auto;
      }

      button,
      a.btn {
        border: 0;
        border-radius: 8px;
        padding: 0.55rem 0.8rem;
        background: var(--primary);
        color: var(--text);
        text-decoration: none;
        cursor: pointer;
        font-size: 0.9rem;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        transition: background 0.2s ease;
      }

      button:hover,
      a.btn:hover {
        background: var(--primary-hover);
      }

      footer {
        width: min(1100px, 92%);
        margin: 0 auto 1.4rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      footer a {
        color: var(--text);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="banner">
        <h1 class="banner-title">Recursos para GDevelop</h1>
        <div class="banner-stats">
          <span class="stat-pill">
            <i class="bi bi-star-fill" aria-hidden="true"></i>
            <span id="starsCount">--</span> estrellas
          </span>
          <span class="stat-pill">
            <i class="bi bi-eye-fill" aria-hidden="true"></i>
            <span id="visitsCount">--</span> visitas
          </span>
        </div>
      </section>
      <p class="status" id="status">Cargando proyectos...</p>
      <section class="grid" id="projects"></section>
    </main>
    <footer>
      <a href="https://github.com/IvanMass99" target="_blank" rel="noopener noreferrer">
        <i class="bi bi-github" aria-hidden="true"></i>
        <span>IvanMass99</span>
      </a>
    </footer>

    <script>
      const owner = "IvanMass99";
      const repo = "GDevelop-Resources";
      const statusEl = document.getElementById("status");
      const projectsEl = document.getElementById("projects");
      const starsCountEl = document.getElementById("starsCount");
      const visitsCountEl = document.getElementById("visitsCount");

      const api = (path) => `https://api.github.com/repos/${owner}/${repo}${path}`;
      const raw = (path, branch) => `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}`;
      const requiredProjectJsonKeyOrder = [
        "author",
        "category",
        "dimension",
        "extensionNamespace",
        "fullName",
        "gdevelopVersion",
        "helpPath",
        "iconUrl",
        "name",
        "previewIconUrl",
        "shortDescription",
        "version",
        "description",
      ];

      const getJson = async (url) => {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Error ${response.status}`);
        return response.json();
      };

      const hasExpectedProjectSchema = (json) => {
        if (!json || typeof json !== "object" || Array.isArray(json)) return false;
        const keys = Object.keys(json);

        return requiredProjectJsonKeyOrder.every((key, index) => keys[index] === key);
      };

      const normalizeDescription = (description) => {
        if (Array.isArray(description)) {
          return description.filter((line) => typeof line === "string" && line.trim()).join(" ").trim();
        }

        return typeof description === "string" ? description : "";
      };

      const normalizeTags = (tags) => {
        if (!Array.isArray(tags)) return [];
        return tags
          .filter((tag) => typeof tag === "string")
          .map((tag) => tag.trim())
          .filter(Boolean);
      };

      const getVisitCount = async () => {
        try {
          const data = await getJson(`https://api.countapi.xyz/hit/${owner}/${repo}-home`);
          return typeof data?.value === "number" ? data.value : null;
        } catch {
          return null;
        }
      };

      const findProjectJson = (treePaths, projectDir) => {
        const preferred = `Extensions/${projectDir}/${projectDir}.json`;
        if (treePaths.includes(preferred)) return preferred;

        return (
          treePaths.find(
            (path) =>
              path.startsWith(`Extensions/${projectDir}/`) &&
              path.split("/").length === 3 &&
              path.endsWith(".json")
          ) || null
        );
      };

      const findProjectIcon = (projectFiles, projectDir) => {
        const iconBasePath = `Extensions/${projectDir}/assets/desktop-icon-512`;

        return (
          projectFiles.find(
            (path) => path === iconBasePath || path.startsWith(`${iconBasePath}.`)
          ) || null
        );
      };

      const renderProjectCard = (project, branch) => {
        const card = document.createElement("article");
        card.className = "card";

        const cardHeader = document.createElement("div");
        cardHeader.className = "card-header";

        const iconCapsule = document.createElement("div");
        iconCapsule.className = "icon-capsule";

        if (project.iconUrl || project.iconPath) {
          const logo = document.createElement("img");
          logo.src = project.iconUrl || raw(project.iconPath, branch);
          logo.alt = `Ícono de ${project.name}`;
          iconCapsule.appendChild(logo);
        } else {
          iconCapsule.innerHTML = '<i class="bi bi-image" aria-hidden="true"></i>';
        }

        const title = document.createElement("h2");
        title.textContent = project.name;

        const meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = project.description || "Sin descripción disponible";

        const details = document.createElement("ul");
        details.className = "details";
        const detailRows = [
          ["Autor", project.author || "No indicado"],
          ["Versión", project.version || "No indicada"],
          ["Carpeta", project.folder],
          ["Archivo", project.jsonPath || "No encontrado"],
          ["Cantidad de archivos", String(project.fileCount)],
        ];

        detailRows.forEach(([label, value]) => {
          const li = document.createElement("li");
          const labelEl = document.createElement("strong");
          labelEl.textContent = `${label}:`;
          li.appendChild(labelEl);
          li.append(` ${value}`);
          details.appendChild(li);
        });

        let tagsEl = null;
        if (project.tags.length) {
          tagsEl = document.createElement("div");
          tagsEl.className = "tags";
          project.tags.forEach((tag, index) => {
            const bubble = document.createElement("span");
            bubble.className = `tag ${index % 2 === 0 ? "tag-a" : "tag-b"}`;
            bubble.textContent = tag;
            tagsEl.appendChild(bubble);
          });
        }

        const actions = document.createElement("div");
        actions.className = "actions";

        const download = document.createElement("a");
        download.className = "btn";
        download.target = "_blank";
        download.rel = "noopener noreferrer";
        download.innerHTML = '<i class="bi bi-download"></i><span>descargar extensión</span>';
        const treeUrl = `https://github.com/${owner}/${repo}/tree/${branch}/Extensions/${project.folder}`;
        download.href = `https://download-directory.github.io/?url=${encodeURIComponent(treeUrl)}`;

        actions.append(download);
        cardHeader.append(iconCapsule, title);
        card.append(cardHeader, meta, details);
        if (tagsEl) card.appendChild(tagsEl);
        card.append(actions);
        projectsEl.appendChild(card);
      };

      const loadProjects = async () => {
        try {
          const repoInfo = await getJson(api(""));
          const branch = repoInfo.default_branch;
          const visitCount = await getVisitCount();
          starsCountEl.textContent = String(repoInfo.stargazers_count ?? "--");
          visitsCountEl.textContent = visitCount === null ? "--" : String(visitCount);

          const extensionsEntries = await getJson(api(`/contents/Extensions?ref=${branch}`));
          const projectDirs = extensionsEntries.filter((entry) => entry.type === "dir").map((entry) => entry.name);

          const fullTree = await getJson(api(`/git/trees/${branch}?recursive=1`));
          const filePaths = (fullTree.tree || [])
            .filter((entry) => entry.type === "blob")
            .map((entry) => entry.path);

          const projects = await Promise.all(
            projectDirs.map(async (folder) => {
              const projectFiles = filePaths.filter((path) => path.startsWith(`Extensions/${folder}/`));
              const jsonPath = findProjectJson(filePaths, folder);
              const iconPath = findProjectIcon(projectFiles, folder);
              if (!jsonPath) return null;

              try {
                const json = await getJson(raw(jsonPath, branch));
                if (!hasExpectedProjectSchema(json)) return null;

                const name = typeof json.name === "string" ? json.name : "";
                if (!name.trim()) return null;

                const author = typeof json.author === "string" ? json.author : "";
                const version = typeof json.version === "string" ? json.version : "";
                const iconUrl = typeof json.iconUrl === "string" ? json.iconUrl : "";
                const description = normalizeDescription(json.description);
                const tags = normalizeTags(json.tags);

                return {
                  folder,
                  name,
                  description,
                  author,
                  version,
                  jsonPath,
                  iconPath,
                  iconUrl,
                  tags,
                  fileCount: projectFiles.length,
                };
              } catch {
                return null;
              }
            })
          );
          const validProjects = projects.filter((project) => project !== null);

          projectsEl.innerHTML = "";

          if (!validProjects.length) {
            statusEl.textContent = "No se encontraron proyectos con la estructura JSON requerida.";
            return;
          }

          statusEl.textContent = `Se encontraron ${validProjects.length} proyecto(s) válidos.`;
          validProjects.forEach((project) => renderProjectCard(project, branch));
        } catch (error) {
          statusEl.textContent = "No fue posible cargar los proyectos.";
          console.error(error);
        }
      };

      loadProjects();
    </script>
  </body>
</html>
