<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GDevelop Resources</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: rgb(9, 7, 15);
        --bg-alt: rgb(19, 13, 31);
        --card: #171125;
        --text: #f5f1ff;
        --muted: #b7a9cf;
        --primary: #8b5cf6;
        --primary-hover: #7c3aed;
        --border: rgb(47, 32, 72);
      }

      * {
        box-sizing: border-box;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      body {
        margin: 0;
       
        background: linear-gradient(155deg, var(--bg), var(--bg-alt));
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .hero {
        position: relative;
        width: 100%;
        min-height: 260px;
        background:linear-gradient(to bottom, rgba(57, 33, 114, 0.82), rgba(9, 7, 15,1));
        display: grid;
        place-items: center;
    
      }

      .hero-content {
        width: min(1100px, 92%);
      }

      .hero-title {
        margin: 0 0 0.9rem;
        font-size: clamp(1.5rem, 4vw, 2.5rem);
      }

      main {
        width: min(1100px, 92%);
        margin: 2rem auto 3rem;
        flex: 1;
      }

      .filters {
        margin-bottom: 1.6rem;
        padding: 1rem 1rem 1.15rem;
        background: rgba(139, 92, 246, 0.08);
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .search-label {
        display: block;
        font-size: 0.88rem;
        color: var(--muted);
        margin-bottom: 0.45rem;
      }

      .search-input {
        width: 100%;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: rgba(7, 5, 13, 0.7);
        color: var(--text);
        padding: 0.62rem 0.75rem;
        font: inherit;
        margin-bottom: 0.9rem;
      }

      .search-input::placeholder {
        color: #9b8fb3;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }

      .tag-filters {
        display: flex;
        gap: 0.65rem;
        flex-wrap: wrap;
      }

      .content-tabs {
        display: flex;
        gap: 0.65rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }

      .content-tab {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.55rem 0.8rem;
        background: rgba(9, 7, 16, 0.7);
        color: var(--text);
      }

      .content-tab.active {
        background: var(--primary);
        border-color: var(--primary);
      }

      .filter-pill,
      .stat-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.42rem 0.7rem;
        color: var(--text);
        font-size: 0.9rem;
        background: rgba(9, 7, 16, 0.7);
      }

      .filter-pill {
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease;
      }

      .filter-pill.active {
        border-color: rgba(139, 92, 246, 0.8);
        background: rgba(139, 92, 246, 0.2);
      }

      .star-icon {
        color: #facc15;
      }

      .status {
        color: var(--muted);
        margin-top: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1rem;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .card h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }

      .icon-capsule {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        background: linear-gradient(to bottom, #ffffff, #999999);
        padding: 2px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
      }

      .icon-capsule img {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        object-fit: contain;
        background: rgba(0, 0, 0, 0.16);
        padding: 4px;
      }

      .icon-capsule i {
        font-size: 1.7rem;
        color: #2b2b2b;
      }

      .asset-preview {
        width: 100%;
        height: 160px;
        border: 1px solid var(--border);
        border-radius: 8px;
        object-fit: contain;
        background-color: #0b0812;
        background-image: linear-gradient(45deg, #171125 25%, transparent 25%), linear-gradient(-45deg, #171125 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #171125 75%), linear-gradient(-45deg, transparent 75%, #171125 75%);
        background-size: 18px 18px;
        background-position: 0 0, 0 9px, 9px -9px, -9px 0px;
      }

      .meta {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .details {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.35rem;
      }

      .details li {
        color: var(--muted);
        font-size: 0.9rem;
        overflow-wrap: anywhere;
      }

      .details strong {
        color: var(--text);
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
      }

      .tag {
        border-radius: 999px;
        padding: 0.25rem 0.65rem;
        font-size: 0.8rem;
        border: 1px solid transparent;
      }

      .tag-a {
        background: rgba(139, 92, 246, 0.18);
        border-color: rgba(139, 92, 246, 0.42);
      }

      .tag-b {
        background: rgba(34, 197, 94, 0.16);
        border-color: rgba(34, 197, 94, 0.38);
      }

      .actions {
        display: flex;
        gap: 0.6rem;
        margin-top: auto;
      }

      button,
      a.btn {
        margin-top:10px;
        margin-bottom:10px;
        border: 0;
        border-radius: 8px;
        padding: 0.55rem 0.8rem;
        background: var(--primary);
        color: var(--text);
        text-decoration: none;
        cursor: pointer;
        font-size: 0.9rem;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        transition: background 0.2s ease;
      }

      button:hover,
      a.btn:hover {
        background: var(--primary-hover);
      }

      button.filter-pill {
        border: 1px solid var(--border);
        padding: 0.42rem 0.7rem;
        background: rgba(9, 7, 16, 0.7);
      }

      button.filter-pill:hover {
        background: rgba(139, 92, 246, 0.2);
      }

      footer {
        width: min(1100px, 92%);
        margin: 0 auto 3rem;
        color: var(--muted);
        font-size: 0.9rem;
        text-align: center;
      }

      .footer-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.8rem 1.2rem;
      }

      footer a {
        color: var(--text);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="hero-content">
        <h1 class="hero-title">GDevelop Resources</h1>
        <h3> A collection of free assets and resources</h3>
         <span class="stat-pill">
            <i class="bi bi-github" aria-hidden="true"></i>
             <i class="bi bi-star-fill star-icon" aria-hidden="true"></i>
            <span id="starsCount">--</span> 
          </span>
      </div>
    </header>
    <main>
      <section class="filters">
        <div class="content-tabs" id="contentTabs" aria-label="Resource type">
          <button class="content-tab active" type="button" data-section="Extensions"><i class="bi bi-puzzle"></i> Extensions</button>
          <button class="content-tab" type="button" data-section="Projects"><i class="bi bi-controller"></i> Projects</button>
          <button class="content-tab" type="button" data-section="Assets"><i class="bi bi-images"></i> Assets</button>
        </div>
        <div class="topbar">
          <div class="tag-filters" id="tagFilters"></div>
        </div>
        <label class="search-label" for="searchInput">Search resources</label>
        <input
          class="search-input"
          type="search"
          id="searchInput"
          placeholder="Type to find resources..."
          autocomplete="off"
        />
      </section>
      <p class="status" id="status">Loading resources...</p>
      <section class="grid" id="projects"></section>
    </main>
    <footer>
      
      <div class="footer-links">
         <a href="https://github.com/IvanMass99/GDevelop-Resources" target="_blank" rel="noopener noreferrer">
          <i class="bi bi-github" aria-hidden="true"></i>
          <span>IvanMass99</span>
        </a>
        <a href="https://buymeacoffee.com/ivan.dev1" target="_blank" rel="noopener noreferrer">
          <i class="bi bi-cup-hot-fill" aria-hidden="true"></i>
          <span>Donate</span>
        </a>
        <a href="https://gdevelop.io/download" target="_blank" rel="noopener noreferrer">
          <i class="bi bi-cloud-arrow-down-fill" aria-hidden="true"></i>
          <span>Download GDevelop</span>
        </a>
     
      </div>
    </footer>

    <script>
      /* Resource catalogue is generated from the repository's three top-level folders. */
      const owner = "IvanMass99";
      const repo = "GDevelop-Resources";
      const statusEl = document.getElementById("status");
      const projectsEl = document.getElementById("projects");
      const starsCountEl = document.getElementById("starsCount");
      const tagFiltersEl = document.getElementById("tagFilters");
      const searchInputEl = document.getElementById("searchInput");
      const contentTabsEl = document.getElementById("contentTabs");
      const sections = ["Extensions", "Projects", "Assets"];
      const imageExtensions = new Set(["png", "jpg", "jpeg", "gif", "webp", "svg", "avif"]);
      const audioExtensions = new Set(["mp3", "wav", "ogg", "m4a", "aac", "flac"]);
      let currentBranch = "";
      let activeSection = "Extensions";
      let activeTag = "all";
      let resourcesBySection = { Extensions: [], Projects: [], Assets: [] };

      const api = (path) => `https://api.github.com/repos/${owner}/${repo}${path}`;
      const raw = (path) => `https://raw.githubusercontent.com/${owner}/${repo}/${currentBranch}/${path}`;
      const getJson = async (url) => {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Error ${response.status}`);
        return response.json();
      };
      const stringValue = (value) => typeof value === "string" ? value.trim() : "";
      const descriptionValue = (json) => {
        const candidate = json.shortDescription || json.description || json.properties?.description || "";
        return Array.isArray(candidate) ? candidate.filter((line) => typeof line === "string").join(" ") : stringValue(candidate);
      };
      const tagsValue = (json, fallback = []) => Array.isArray(json.tags)
        ? json.tags.filter((tag) => typeof tag === "string" && tag.trim()).map((tag) => tag.trim())
        : fallback;
      const extensionOf = (path) => path.split(".").pop().toLowerCase();
      const assetInfo = (path) => {
        const extension = extensionOf(path);
        if (imageExtensions.has(extension)) return { type: "Sprite", icon: "bi-image", preview: true };
        if (audioExtensions.has(extension)) return { type: "Sound", icon: "bi-volume-up", preview: false };
        if (["json", "txt", "md", "csv", "xml"].includes(extension)) return { type: "Data", icon: "bi-file-earmark-code", preview: false };
        if (["ttf", "otf", "woff", "woff2"].includes(extension)) return { type: "Font", icon: "bi-fonts", preview: false };
        return { type: "File", icon: "bi-file-earmark", preview: false };
      };
      const folderDownloadUrl = (folder) => `https://download-directory.github.io/?url=${encodeURIComponent(`https://github.com/${owner}/${repo}/tree/${currentBranch}/${folder}`)}`;

      const renderCard = (item) => {
        const card = document.createElement("article");
        card.className = "card";
        const header = document.createElement("div");
        header.className = "card-header";
        const icon = document.createElement("div");
        icon.className = "icon-capsule";
        if (item.image) {
          const image = document.createElement("img");
          image.src = item.image;
          image.alt = `${item.name} preview`;
          icon.appendChild(image);
        } else icon.innerHTML = `<i class="bi ${item.icon || "bi-folder"}" aria-hidden="true"></i>`;
        const title = document.createElement("h2");
        title.textContent = item.name;
        header.append(icon, title);
        card.appendChild(header);
        if (item.preview) {
          const preview = document.createElement("img");
          preview.className = "asset-preview";
          preview.src = item.preview;
          preview.alt = `${item.name} sprite preview`;
          preview.loading = "lazy";
          card.appendChild(preview);
        }
        const meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = item.description || "No description available";
        card.appendChild(meta);
        const details = document.createElement("ul");
        details.className = "details";
        item.details.forEach(([label, value]) => {
          if (!value) return;
          const li = document.createElement("li");
          li.innerHTML = `<strong>${label}:</strong> `;
          li.append(value);
          details.appendChild(li);
        });
        card.appendChild(details);
        if (item.tags.length) {
          const tags = document.createElement("div");
          tags.className = "tags";
          item.tags.forEach((tag, index) => {
            const tagEl = document.createElement("span");
            tagEl.className = `tag ${index % 2 ? "tag-b" : "tag-a"}`;
            tagEl.textContent = tag;
            tags.appendChild(tagEl);
          });
          card.appendChild(tags);
        }
        const actions = document.createElement("div");
        actions.className = "actions";
        const link = document.createElement("a");
        link.className = "btn";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.href = item.downloadUrl;
        link.innerHTML = item.isAsset ? '<i class="bi bi-box-arrow-up-right"></i><span>View file</span>' : '<i class="bi bi-download"></i><span>Download</span>';
        actions.appendChild(link);
        card.appendChild(actions);
        projectsEl.appendChild(card);
      };

      const buildFilters = (items) => {
        const tagMap = new Map();
        items.forEach((item) => item.tags.forEach((tag) => tagMap.set(tag.toLowerCase(), tag)));
        tagFiltersEl.innerHTML = "";
        [["all", "All"], ...[...tagMap.entries()].sort((a, b) => a[1].localeCompare(b[1]))].forEach(([key, label]) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `filter-pill${activeTag === key ? " active" : ""}`;
          button.dataset.tag = key;
          button.textContent = label;
          tagFiltersEl.appendChild(button);
        });
      };
      const render = () => {
        const query = searchInputEl.value.trim().toLowerCase();
        const sectionItems = resourcesBySection[activeSection] || [];
        const items = sectionItems.filter((item) =>
          (activeTag === "all" || item.tags.some((tag) => tag.toLowerCase() === activeTag)) &&
          `${item.name} ${item.description} ${item.tags.join(" ")}`.toLowerCase().includes(query)
        );
        projectsEl.innerHTML = "";
        items.forEach(renderCard);
        statusEl.textContent = items.length ? `${items.length} ${activeSection.toLowerCase()} shown.` : `No ${activeSection.toLowerCase()} match the filters.`;
      };
      const selectSection = (section) => {
        activeSection = section;
        activeTag = "all";
        contentTabsEl.querySelectorAll(".content-tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.section === section));
        buildFilters(resourcesBySection[section]);
        render();
      };

      const loadExtensions = async (treePaths) => {
        const entries = await getJson(api(`/contents/Extensions?ref=${currentBranch}`));
        return Promise.all(entries.filter((entry) => entry.type === "dir").map(async (entry) => {
          const prefix = `Extensions/${entry.name}/`;
          const jsonPath = treePaths.find((path) => path.startsWith(prefix) && path.endsWith(".json"));
          if (!jsonPath) return null;
          try {
            const json = await getJson(raw(jsonPath));
            return {
              name: stringValue(json.fullName) || stringValue(json.name) || entry.name,
              description: descriptionValue(json), icon: "bi-puzzle", image: stringValue(json.iconUrl),
              tags: tagsValue(json, [stringValue(json.category) || "Extension"]),
              details: [["Author", stringValue(json.author)], ["Version", stringValue(json.version)], ["Category", stringValue(json.category)]],
              downloadUrl: folderDownloadUrl(`Extensions/${entry.name}`),
            };
          } catch { return null; }
        }));
      };
      const loadProjects = async (treePaths) => {
        const entries = await getJson(api(`/contents/Projects?ref=${currentBranch}`));
        return Promise.all(entries.filter((entry) => entry.type === "dir").map(async (entry) => {
          const prefix = `Projects/${entry.name}/`;
          const projectFiles = treePaths.filter((path) => path.startsWith(prefix));
          const target = `${prefix}${entry.name}.json`.toLowerCase();
          const jsonPath = projectFiles.find((path) => path.toLowerCase() === target);
          if (!jsonPath) return null;
          try {
            const json = await getJson(raw(jsonPath));
            const iconPath = projectFiles.find((path) => /assets\/desktop-icon-512\.(png|jpg|jpeg|webp)$/i.test(path));
            return {
              name: stringValue(json.properties?.windowTitle) || stringValue(json.name) || entry.name,
              description: descriptionValue(json), icon: "bi-controller", image: iconPath ? raw(iconPath) : "",
              tags: tagsValue(json, ["Project"]),
              details: [["Files", String(projectFiles.length)], ["Scenes", String((json.layouts || []).length)], ["Version", stringValue(json.properties?.version)]],
              downloadUrl: folderDownloadUrl(`Projects/${entry.name}`),
            };
          } catch { return null; }
        }));
      };
      const loadAssets = (treePaths) => treePaths.filter((path) => path.startsWith("Assets/")).map((path) => {
        const info = assetInfo(path);
        return {
          name: path.split("/").pop(), description: path.slice("Assets/".length), icon: info.icon,
          preview: info.preview ? raw(path) : "", tags: [info.type],
          details: [["Type", info.type], ["Format", extensionOf(path).toUpperCase()]],
          downloadUrl: `https://github.com/${owner}/${repo}/blob/${currentBranch}/${path}`, isAsset: true,
        };
      });
      const loadCatalogue = async () => {
        try {
          const repoInfo = await getJson(api(""));
          currentBranch = repoInfo.default_branch;
          starsCountEl.textContent = String(repoInfo.stargazers_count ?? "--");
          const tree = await getJson(api(`/git/trees/${currentBranch}?recursive=1`));
          const paths = (tree.tree || []).filter((entry) => entry.type === "blob").map((entry) => entry.path);
          const [extensions, projects] = await Promise.all([loadExtensions(paths), loadProjects(paths)]);
          resourcesBySection = { Extensions: extensions.filter(Boolean), Projects: projects.filter(Boolean), Assets: loadAssets(paths) };
          selectSection(activeSection);
        } catch (error) {
          statusEl.textContent = "Could not load resources.";
          console.error(error);
        }
      };
      contentTabsEl.addEventListener("click", (event) => {
        const tab = event.target.closest(".content-tab");
        if (tab) selectSection(tab.dataset.section);
      });
      tagFiltersEl.addEventListener("click", (event) => {
        const button = event.target.closest(".filter-pill");
        if (!button) return;
        activeTag = button.dataset.tag;
        buildFilters(resourcesBySection[activeSection]);
        render();
      });
      searchInputEl.addEventListener("input", render);
      loadCatalogue();
    </script>
  </body>
</html>
